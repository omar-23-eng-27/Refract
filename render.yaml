databases:
  - name: refract-db
    databaseName: refract
    plan: free

services:
  # Django + Daphne (ASGI — handles HTTP and WebSocket)
  - type: web
    name: refract-backend
    runtime: python
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT refract.asgi:application
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: refract.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: refract-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: PYTHON_VERSION
        value: "3.12.0"
